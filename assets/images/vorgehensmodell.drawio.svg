<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1001px" height="201px" viewBox="-0.5 -0.5 1001 201">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
  <g>
    <!-- 1. Problem -->
    <rect x="20" y="40" width="180" height="100" rx="8" fill="#FFE6E6" stroke="#CC0000" stroke-width="2"/>
    <text x="110" y="75" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle">Problemidentifikation</text>
    <text x="110" y="100" font-family="Helvetica" font-size="11" text-anchor="middle">Navigationsheraus-</text>
    <text x="110" y="115" font-family="Helvetica" font-size="11" text-anchor="middle">forderungen in CAP</text>
    <text x="110" y="132" font-family="Helvetica" font-size="10" fill="#666" text-anchor="middle">Kapitel 4</text>
    
    <!-- Pfeil 1 -->
    <path d="M 200 90 L 220 90" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- 2. Anforderungen -->
    <rect x="220" y="40" width="180" height="100" rx="8" fill="#E6F3FF" stroke="#0066CC" stroke-width="2"/>
    <text x="310" y="75" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle">Anforderungsanalyse</text>
    <text x="310" y="100" font-family="Helvetica" font-size="11" text-anchor="middle">Designziele und</text>
    <text x="310" y="115" font-family="Helvetica" font-size="11" text-anchor="middle">Anforderungen</text>
    <text x="310" y="132" font-family="Helvetica" font-size="10" fill="#666" text-anchor="middle">Kapitel 4</text>
    
    <!-- Pfeil 2 -->
    <path d="M 400 90 L 420 90" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- 3. Konzeption -->
    <rect x="420" y="40" width="180" height="100" rx="8" fill="#FFF4E6" stroke="#FF9900" stroke-width="2"/>
    <text x="510" y="75" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle">Konzeption</text>
    <text x="510" y="100" font-family="Helvetica" font-size="11" text-anchor="middle">Vergleich von</text>
    <text x="510" y="115" font-family="Helvetica" font-size="11" text-anchor="middle">Integrationsstrategien</text>
    <text x="510" y="132" font-family="Helvetica" font-size="10" fill="#666" text-anchor="middle">Kapitel 5</text>
    
    <!-- Pfeil 3 -->
    <path d="M 600 90 L 620 90" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- 4. Implementierung -->
    <rect x="620" y="40" width="180" height="100" rx="8" fill="#E6FFE6" stroke="#00CC00" stroke-width="2"/>
    <text x="710" y="75" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle">Implementierung</text>
    <text x="710" y="100" font-family="Helvetica" font-size="11" text-anchor="middle">Prototyp der</text>
    <text x="710" y="115" font-family="Helvetica" font-size="11" text-anchor="middle">VS Code Extension</text>
    <text x="710" y="132" font-family="Helvetica" font-size="10" fill="#666" text-anchor="middle">Kapitel 6</text>
    
    <!-- Pfeil 4 -->
    <path d="M 800 90 L 820 90" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- 5. Evaluation -->
    <rect x="820" y="40" width="180" height="100" rx="8" fill="#F0E6FF" stroke="#9900CC" stroke-width="2"/>
    <text x="910" y="75" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle">Evaluation</text>
    <text x="910" y="100" font-family="Helvetica" font-size="11" text-anchor="middle">Bewertung und</text>
    <text x="910" y="115" font-family="Helvetica" font-size="11" text-anchor="middle">Diskussion</text>
    <text x="910" y="132" font-family="Helvetica" font-size="10" fill="#666" text-anchor="middle">Kapitel 7-8</text>
  </g>
</svg>
