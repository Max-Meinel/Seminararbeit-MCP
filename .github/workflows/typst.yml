name: Build & Deploy PDF to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-open-sans fonts-montserrat
          fc-cache -fv

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Build site folder
        run: |
          mkdir -p site
          typst compile --root . main.typ site/main.pdf

          # simple landing page that shows the PDF
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="de">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Bachelorarbeit Max Meinel</title>
              <style>
                html, body { height: 100%; margin: 0; }
                iframe { width: 100%; height: 100%; border: 0; }
              </style>
            </head>
            <body>
              <iframe src="main.pdf"></iframe>
            </body>
          </html>
          HTML

      - name: Deploy to PUBLIC repo (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: Max-Meinel/Bachelorarbeit
          publish_branch: main
          publish_dir: site
          force_orphan: true
          enable_jekyll: true